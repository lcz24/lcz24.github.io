# Site configuration. Full option reference: https://gohugo.io/configuration/all/
# Commit to master and GitHub Actions rebuilds and deploys the site automatically.
baseURL = "https://book.llcczz.org/"
locale = "en-US"
defaultContentLanguage = "en"
title = "lcz's Blog"
theme = "PaperMod"
hasCJKLanguage = false

enableRobotsTXT = true
enableEmoji = true

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[taxonomies]
  tag = "tags"
  category = "categories"

[params]
  env = "production"
  description = "Notes on penetration testing, vulnerability research, and detection engineering."
  author = "lcz"
  DateFormat = "2006-01-02"
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  TocOpen = false
  ShowWordCount = true
  comments = false

  [params.homeInfoParams]
    Title = "Hi, I'm lcz 👋"
    Content = "Notes on penetration testing, vulnerability research, and detection engineering."

  [params.assets]
    favicon = "/favicon.svg"
    theme_color = "#4f46e5"
    msapplication_TileColor = "#4f46e5"

  [params.editPost]
    URL = "https://github.com/lcz24/lcz24.github.io/edit/master/content/"
    Text = "Edit this page on GitHub"
    appendFilePath = true

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/lcz24"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:a1443567234@gmail.com"

  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10

  [[menu.main]]
    identifier = "archives"
    name = "Archives"
    url = "/archives/"
    weight = 20

  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 30

  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 40

  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 50

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    guessSyntax = true
    lineNos = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
